# ======================================================
# APPLICATION
# ======================================================
spring.application.name=pdfbot-ai

# ======================================================
# DATASOURCE
# ======================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/pdfchat
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ======================================================
# FILE UPLOAD
# ======================================================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ======================================================
# JPA / HIBERNATE
# ======================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ======================================================
# AZURE OPENAI (FIXED)
# ======================================================
spring.ai.azure.openai.api-key=${AZURE_OPENAI_API_KEY}
spring.ai.azure.openai.endpoint=${AZURE_OPENAI_ENDPOINT}

spring.ai.azure.openai.chat.options.deployment-name=${AZURE_OPENAI_DEPLOYMENT}
spring.ai.azure.openai.chat.options.temperature=1

# ⚠️ FIXED PARAMETER (IMPORTANT)
spring.ai.azure.openai.chat.options.max-completion-tokens=2000

# ======================================================
# PGVECTOR (FIXED)
# ======================================================
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.index-type=hnsw
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.max-document-batch-size=1000

# ======================================================
# LM STUDIO (OPTIONAL - can remove if not used)
# ======================================================
lmstudio.embedding.url=http://127.0.0.1:1234/v1/embeddings
lmstudio.embedding.model=text-embedding-nomic-embed-text-v1.5-embedding

# ======================================================
# SERVER
# ======================================================
server.port=8080

# ======================================================
# LOGGING
# ======================================================
logging.level.org.springframework.ai=DEBUG
logging.level.org.hibernate.SQL=DEBUG